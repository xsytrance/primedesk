<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="cyanStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#7dff9e"/>
    </linearGradient>
  </defs>
  <!-- Laptop outline -->
  <rect x="180" y="50" width="240" height="140" rx="12" fill="none" stroke="url(#cyanStroke)" stroke-width="2"/>
  <rect x="200" y="70" width="200" height="100" rx="4" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <!-- Arrows -->
  <path d="M 60 120 L 140 120" stroke="#00d9ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 460 120 L 540 120" stroke="#7dff9e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="100" y="155" font-family="Orbitron, sans-serif" font-size="14" fill="#00d9ff" text-anchor="middle">ACQUIRE</text>
  <text x="300" y="40" font-family="Orbitron, sans-serif" font-size="14" fill="#00d9ff" text-anchor="middle">CONFIGURE</text>
  <text x="500" y="155" font-family="Orbitron, sans-serif" font-size="14" fill="#7dff9e" text-anchor="middle">SHIP</text>
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d9ff"/>
    </marker>
  </defs>
</svg>
