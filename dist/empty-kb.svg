<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Open book -->
  <path d="M 200 80 L 200 240" stroke="#00d9ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Left page -->
  <path d="M 200 80 Q 160 70 100 85 L 100 225 Q 160 210 200 220 Z" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Right page -->
  <path d="M 200 80 Q 240 70 300 85 L 300 225 Q 240 210 200 220 Z" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Circuit lines left -->
  <line x1="130" y1="110" x2="170" y2="110" stroke="#00d9ff" stroke-width="1" opacity="0.25"/>
  <line x1="130" y1="130" x2="160" y2="130" stroke="#00d9ff" stroke-width="1" opacity="0.25"/>
  <line x1="130" y1="150" x2="170" y2="150" stroke="#00d9ff" stroke-width="1" opacity="0.25"/>
  <line x1="130" y1="170" x2="155" y2="170" stroke="#00d9ff" stroke-width="1" opacity="0.25"/>
  <!-- Circuit lines right -->
  <line x1="230" y1="110" x2="270" y2="110" stroke="#ff4fd8" stroke-width="1" opacity="0.25"/>
  <line x1="240" y1="130" x2="270" y2="130" stroke="#ff4fd8" stroke-width="1" opacity="0.25"/>
  <line x1="230" y1="150" x2="270" y2="150" stroke="#ff4fd8" stroke-width="1" opacity="0.25"/>
  <line x1="245" y1="170" x2="270" y2="170" stroke="#ff4fd8" stroke-width="1" opacity="0.25"/>
  <!-- Circuit nodes -->
  <circle cx="130" cy="110" r="3" fill="#00d9ff" opacity="0.3"/>
  <circle cx="130" cy="150" r="3" fill="#00d9ff" opacity="0.3"/>
  <circle cx="270" cy="110" r="3" fill="#ff4fd8" opacity="0.3"/>
  <circle cx="270" cy="150" r="3" fill="#ff4fd8" opacity="0.3"/>
  <!-- Central chip -->
  <rect x="185" y="140" width="30" height="20" rx="3" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="150" r="4" fill="#00d9ff" opacity="0.2"/>
</svg>
