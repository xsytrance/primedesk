<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PrimeDesk</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/main.css?v=20260520a" />
</head>
<body class="logged-out">
  <header class="topbar">
    <h1>PrimeDesk</h1>
    <div class="row" style="gap:12px; width:auto;">
      <div id="notif" class="pill">🔔 0</div>
      <div id="me"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="card login-shell" id="loginCard">
      <div class="login-scanline" aria-hidden="true"></div>
      <div class="sys-lock" aria-hidden="true">⌂</div>
      <h2 class="sys-title">SYSTEM_ACCESS</h2>
      <div class="hero-sub">prime desk // secure gate</div>

      <label class="sys-label" for="identifier">IDENTIFICATION_KEY</label>
      <select id="identifier" aria-label="username">
        <option value="egi">egi</option>
        <option value="patrick">patrick</option>
      </select>

      <label class="sys-label" for="password">ENCRYPTION_PASSCODE</label>
      <input id="password" type="password" placeholder=">> ************" onkeydown="handleLoginEnter(event)" />

      <button class="init-btn" onclick="login()">INITIALIZE >>></button>
      <div class="sys-foot">authorized process sequence only</div>
    </section>

    <section class="card hidden" id="forcePwCard">
      <h2>Set new password</h2>
      <input id="newPassword" type="password" placeholder="New strong password" />
      <button onclick="changePassword()">Save</button>
    </section>

    <section id="app" class="hidden">
      <nav class="tabs">
        <button onclick="setTab('home')">Home</button>
        <button onclick="setTab('tickets')">Tickets</button>
        <button onclick="setTab('chat')">Chat</button>
        <button onclick="setTab('kb')">KB</button>
        <button onclick="setTab('xp')">XP</button>
      </nav>

      <section id="tab-home" class="card tab"></section>

      <section id="tab-tickets" class="card tab hidden">
        <h2>Tickets</h2>
        <div class="row">
          <input id="title" placeholder="Ticket title" />
          <select id="timing">
            <option>soon</option>
            <option selected>later</option>
            <option>whenever</option>
          </select>
          <button onclick="createTicket()">Create</button>
        </div>
        <div class="row">
          <input id="ticketSearch" placeholder="Search" oninput="loadTickets()" />
          <select id="statusFilter" onchange="loadTickets()"><option value="">All status</option><option>Open</option><option>In Progress</option><option>Pending</option><option>Resolved</option><option>Closed</option></select>
        </div>
        <div id="tickets"></div>
      </section>

      <section id="tab-chat" class="card tab hidden">
        <h2>War Room</h2>
        <div id="chat"></div>
        <div class="row">
          <input id="chatBody" placeholder="message" />
          <button onclick="sendMessage()">Send</button>
        </div>
      </section>

      <section id="tab-kb" class="card tab hidden">
        <h2>Knowledge Base</h2>
        <div class="row">
          <input id="kbTitle" placeholder="Article title" />
          <button onclick="createKb()">Add</button>
        </div>
        <textarea id="kbBody" placeholder="Solution / procedure"></textarea>
        <input id="kbSearch" placeholder="Search KB" oninput="loadKb()" />
        <div id="kb"></div>
      </section>

      <section id="tab-xp" class="card tab hidden">
        <h2>XP</h2>
        <div id="xp"></div>
      </section>
    </section>
  </main>

  <div class="sauron-eye" aria-hidden="true"></div>

  <section id="opsFooter" class="ops-footer hidden" aria-live="polite"></section>

  <script src="/socket.io/socket.io.js?v=20260519k"></script>
  <script src="/js/app.js?v=20260520h"></script>
</body>
</html>
