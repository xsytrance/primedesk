<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(0,217,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(0,217,255,0.02)"/>
    </linearGradient>
  </defs>
  <!-- Desk surface -->
  <rect x="50" y="180" width="300" height="8" rx="4" fill="rgba(0,217,255,0.2)"/>
  <!-- Ticket -->
  <rect x="120" y="110" width="100" height="70" rx="8" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="135" y1="130" x2="200" y2="130" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  <line x1="135" y1="145" x2="185" y2="145" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  <line x1="135" y1="160" x2="170" y2="160" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  <!-- Ticket number -->
  <text x="170" y="128" font-family="JetBrains Mono, monospace" font-size="10" fill="#00d9ff" opacity="0.5" text-anchor="middle">#TKT-0000</text>
  <!-- Coffee cup -->
  <path d="M 280 160 L 280 185 Q 280 195 270 195 L 250 195 Q 240 195 240 185 L 240 160 Z" fill="none" stroke="#7dff9e" stroke-width="1.5" opacity="0.4"/>
  <path d="M 280 165 Q 295 165 295 178 Q 295 190 280 190" fill="none" stroke="#7dff9e" stroke-width="1.5" opacity="0.4"/>
  <!-- Steam -->
  <path d="M 255 150 Q 260 140 255 130" stroke="#7dff9e" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 265 148 Q 270 138 265 128" stroke="#7dff9e" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
